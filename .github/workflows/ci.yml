name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (lint, migrations, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: obzerve
          POSTGRES_PASSWORD: obzerve
          POSTGRES_DB: obzerve
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U obzerve -d obzerve"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      OBZERVE_DATABASE_URL: postgresql+asyncpg://obzerve:obzerve@localhost:5432/obzerve
      # Fail (instead of skipping) the server tests if PostgreSQL or Redis is unreachable.
      OBZERVE_REQUIRE_SERVICES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          enable-cache: true

      - name: Install (without the ROCm PyTorch build used for local GPU retrieval)
        # The GPU test skips itself without torch; nothing else needs it.
        run: >-
          uv sync --locked
          --no-install-package torch
          --no-install-package triton-rocm
          --no-install-package sentence-transformers

      - name: Ruff
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Migrations apply and match the models
        run: |
          uv run --no-sync obzerve-server migrate
          uv run --no-sync obzerve-server check-migrations

      - name: Tests
        run: uv run --no-sync pytest -rs

  sdk:
    name: SDK wheel (Python ${{ matrix.python }}, ${{ matrix.deps }} deps)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.10", deps: minimum }
          - { python: "3.13", deps: latest }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          enable-cache: true
      - name: Build, check metadata, install into a fresh environment, run the SDK tests
        run: |
          uv build --package obzerve -o dist
          uvx twine check --strict dist/*
          tools/test_sdk_wheel.sh "${{ matrix.python }}" "${{ matrix.deps }}" dist/*.whl

  web:
    name: Dashboard (typecheck, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  images:
    name: Container images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Compose file is valid
        run: docker compose --profile stack config --quiet
