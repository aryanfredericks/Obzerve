[project]
name = "research-agent"
version = "0.1.0"
description = "Demo research agent (local/mock LLM, GPU embeddings) instrumented with Obzerve"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "obzerve-sdk",
    "sentence-transformers>=6.2.0",
    "torch==2.13.0+rocm7.1",
    "triton-rocm==3.7.1",
]

[project.scripts]
research-agent = "research_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.uv.sources]
obzerve-sdk = { workspace = true }
