[project]
name = "obzerve-server"
version = "0.1.0"
description = "Obzerve ingestion and dashboard API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "opentelemetry-proto>=1.45.1",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.16.1",
    "redis>=5",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
obzerve-server = "obzerve_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obzerve_server"]
